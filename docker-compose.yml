# Virtual World Archive: portal + server library.
# The archive service builds and runs each uploaded game server (and its
# Postgres database) as sibling containers through the host Docker socket,
# on the "vwa" network. Players connect through the archive at /play/<server-id>.
services:
  archive:
    build: ./archive
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
    environment:
      SEED_DIR: /seed
      VWA_NETWORK: vwa
      # Accounts and access control (see .env.example)
      PUBLIC_URL: ${PUBLIC_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-1}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - archive-data:/data
      # Seed the archive with the Internet Archive VR world on first start.
      - ./worlds/vrarchive/server:/seed/servers/vrarchive:ro
      - ./worlds/vrarchive/webgl-client:/seed/clients/vrarchive-webgl:ro
    networks: [vwa]

networks:
  vwa:
    name: vwa

volumes:
  archive-data:

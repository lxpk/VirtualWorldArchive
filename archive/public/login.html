<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Virtual World Archive</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap" style="max-width:440px">
  <div class="breadcrumb">Virtual World Archive › Sign in</div>
  <h1 id="heading">Sign in</h1>
  <p class="sub" id="subline">Sign in to upload worlds and administer the server instances you manage.</p>
  <p class="error" id="err" hidden></p>

  <div class="card">
    <a class="btn google" id="google" href="/auth/google" hidden>
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
      Continue with Google
    </a>
    <div class="divider" id="or" hidden>or</div>
    <form id="form" style="display:grid;gap:10px">
      <label data-reg hidden>Name<input name="name" autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Password<input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
      <button class="btn" id="submit">Sign in</button>
    </form>
  </div>
  <p class="small" id="switch"></p>
</div>
<script type="module">
import { header, api, me, esc } from '/common.js';
header('account');
const qs = new URLSearchParams(location.search);
const next = qs.get('next') && qs.get('next').startsWith('/') && !qs.get('next').startsWith('//') ? qs.get('next') : '/';
const $ = id => document.getElementById(id);
let mode = qs.get('mode') === 'register' ? 'register' : 'login';
if (qs.get('error')) { $('err').textContent = qs.get('error'); $('err').hidden = false; }

const m = await me();
if (m.user) location.replace(next);
if (m.google) { $('google').hidden = false; $('or').hidden = false; $('google').href = `/auth/google?next=${encodeURIComponent(next)}`; }

function render() {
  const reg = mode === 'register';
  $('heading').textContent = reg ? 'Create an account' : 'Sign in';
  document.querySelectorAll('[data-reg]').forEach(e => (e.hidden = !reg));
  $('submit').textContent = reg ? 'Create account' : 'Sign in';
  document.querySelector('[name=password]').autocomplete = reg ? 'new-password' : 'current-password';
  $('switch').innerHTML = reg ? 'Already have an account? <a href="#" data-to="login">Sign in</a>'
    : (m.registration ? 'New here? <a href="#" data-to="register">Create an account</a>' : '<span class="muted">Accounts are created by the Site Admin.</span>');
  const a = $('switch').querySelector('[data-to]');
  if (a) a.onclick = e => { e.preventDefault(); mode = a.dataset.to; render(); };
}
render();

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  $('submit').disabled = true; $('err').hidden = true;
  try {
    await api(mode === 'register' ? '/api/auth/register' : '/api/auth/login', { method: 'POST', body });
    location.href = next;
  } catch (err) { $('err').textContent = err.message; $('err').hidden = false; }
  $('submit').disabled = false;
});
</script>
</body>
</html>
